# cargo-about collects the license texts the bundle ships.
# Keep this list in step with the allow list in `deny.toml`.

accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "bzip2-1.0.6",
  "Unlicense",
  "Zlib",
]

targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

private = { ignore = true }

workarounds = ["ring"]

# The pinned GPUI revision ships these without license metadata.
[gpui_shared_string.clarify]
license = "Apache-2.0"

[gpui_util.clarify]
license = "Apache-2.0"
