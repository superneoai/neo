[workspace]

[package]
name = "neo"
description = "The SUPERNEO macOS application"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
authors = ["ACTUAL LTD."]
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
libneo = { git = "ssh://git@github.com/superneoai/libneo.git", rev = "c48c332afc244a9bc357b4072f54b593e4ac2be6", default-features = false, features = [
  "gpui",
] }

# GPUI links `ztracing`, which Zed publishes under `GPL-3.0-or-later`. The
# libneo repository holds a permissive compatibility crate.
# Zed tracks the license state in
# https://github.com/zed-industries/zed/issues/55470.
[patch."https://github.com/zed-industries/zed"]
ztracing = { git = "ssh://git@github.com/superneoai/libneo.git", rev = "c48c332afc244a9bc357b4072f54b593e4ac2be6" }

[patch."https://github.com/zed-industries/font-kit"]
zed-font-kit = { version = "=0.14.1-zed" }

[patch.crates-io]
block = { git = "ssh://git@github.com/superneoai/libneo.git", rev = "c48c332afc244a9bc357b4072f54b593e4ac2be6" }

[package.metadata.packager]
before-packaging-command = "cargo build"
formats = ["app"]
out-dir = "dist"
product-name = "NEO"
description = "The SUPERNEO macOS application"
identifier = "com.superneo.neo"
resources = [{ src = "LICENSE", target = "Legal/AGPL-3.0-or-later.txt" }]

[package.metadata.packager.macos]
minimum-system-version = "26.1"
info-plist-path = "packaging/Info.plist"
