[workspace]
members = ["xtask"]
resolver = "3"

[package]
name = "neo"
description = "NEO for macOS"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
authors = ["ACTUAL LTD."]
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
libneo = { git = "https://github.com/superneoai/libneo.git", rev = "c48c332afc244a9bc357b4072f54b593e4ac2be6", default-features = false, features = [
  "gpui",
] }

# GPUI links `ztracing`, which Zed publishes under `GPL-3.0-or-later`. The
# libneo repository holds a permissive compatibility crate.
# Zed tracks the license state in
# https://github.com/zed-industries/zed/issues/55470.
[patch."https://github.com/zed-industries/zed"]
ztracing = { git = "https://github.com/superneoai/libneo.git", rev = "c48c332afc244a9bc357b4072f54b593e4ac2be6" }

[patch."https://github.com/zed-industries/font-kit"]
zed-font-kit = { version = "=0.14.1-zed" }

[patch.crates-io]
block = { git = "https://github.com/superneoai/libneo.git", rev = "c48c332afc244a9bc357b4072f54b593e4ac2be6" }

[package.metadata.packager]
before-packaging-command = "cargo build"
formats = ["app"]
out-dir = "dist"
product-name = "NEO"
description = "NEO for macOS"
copyright = "Copyright © 2026 ACTUAL LTD."
identifier = "com.superneo.neo"
resources = [
  { src = "LICENSE", target = "Legal/AGPL-3.0-or-later.txt" },
  # Generated by packaging/bundle.sh; MIT, Apache-2.0 and BSD all require their
  # notices to reach whoever receives the binary.
  { src = "packaging/generated/THIRD-PARTY-NOTICES.md", target = "Legal/THIRD-PARTY-NOTICES.md" },
]

[package.metadata.packager.macos]
minimum-system-version = "26.1"
info-plist-path = "packaging/Info.plist"
